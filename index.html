<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>15-Minute Bodyweight Timer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --work: #10b981;
      --rest: #f59e0b;
      --halftime: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .status-badge {
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      align-self: center;
      transition: background 0.3s;
    }
    .badge-work { background: rgba(16, 185, 129, 0.2); color: var(--work); }
    .badge-rest { background: rgba(245, 158, 11, 0.2); color: var(--rest); }
    .badge-halftime { background: rgba(99, 102, 241, 0.2); color: var(--halftime); }
    
    .timer-circle {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 0 auto;
    }
    svg { transform: rotate(-90deg); width: 100%; height: 100%; }
    circle { fill: none; stroke-width: 12; }
    .circle-bg { stroke: #334155; }
    .circle-progress {
      stroke-linecap: round;
      transition: stroke-dashoffset 0.2s linear, stroke 0.3s ease;
    }
    .timer-display {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .time-large {
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .exercise-title {
      font-size: 2.5rem;
      font-weight: 700;
      min-height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .up-next {
      background: var(--card);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .up-next span { color: var(--text); font-weight: 600; }
    .controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }
    button {
      background: var(--card);
      color: var(--text);
      border: 1px solid #334155;
      padding: 0.85rem 1.75rem;
      border-radius: 0.75rem;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }
    button.primary { background: #3b82f6; border-color: #3b82f6; }
    .progress-text { font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <div id="statusBadge" class="status-badge badge-work">Ready</div>
    
    <div class="timer-circle">
      <svg viewBox="0 0 100 100">
        <circle class="circle-bg" cx="50" cy="50" r="42" />
        <circle id="progressRing" class="circle-progress" cx="50" cy="50" r="42" stroke="#10b981" stroke-dasharray="264" stroke-dashoffset="0" />
      </svg>
      <div class="timer-display">
        <div id="timeDisplay" class="time-large">0:45</div>
      </div>
    </div>

    <div>
      <div id="exerciseTitle" class="exercise-title">Prisoner Squats</div>
      <div id="progressText" class="progress-text">Interval 1 of 29 • Total 00:00 / 15:00</div>
    </div>

    <div id="upNext" class="up-next">Up Next: <span>Transition / Rest</span></div>

    <div class="controls">
      <button id="toggleBtn" class="primary" onclick="togglePlay()">Start</button>
      <button onclick="resetWorkout()">Reset</button>
    </div>
  </div>

  <script>
    const exercises = [
      "Prisoner Squats",
      "Push-ups (or Incline on Chair)",
      "Reverse Lunges w/ Torso Twist",
      "Prone Y-to-W Raises",
      "Chair Step-Ups / Side Lunges",
      "Plank to Downward Dog",
      "Dead Bug"
    ];

    // Build timeline: Round 1 (7x work/rest) -> Halftime 60s -> Round 2 (7x work/rest)
    const intervals = [];
    for (let r = 1; r <= 2; r++) {
      exercises.forEach((ex, i) => {
        intervals.push({ type: 'work', title: `${ex}`, duration: 45, nextHint: 'Switch / Rest (15s)' });
        if (i < exercises.length - 1) {
          intervals.push({ type: 'rest', title: 'Switch / Rest', duration: 15, nextHint: `${exercises[i + 1]}` });
        }
      });
      if (r === 1) {
        intervals.push({ type: 'halftime', title: 'Halftime Recovery (Breathe & Drink)', duration: 60, nextHint: `[R2] ${exercises[0]}` });
      }
    }

    let currentIndex = 0;
    let timeLeft = intervals[0].duration;
    let isRunning = false;
    let timerId = null;
    let audioCtx = null;
    let wakeLock = null;

    // Web Audio Synthesizer (No MP3 dependencies)
    function playBeep(freq = 600, duration = 0.12) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (e) {}
    }

    function updateUI() {
      const current = intervals[currentIndex];
      const badge = document.getElementById('statusBadge');
      const ring = document.getElementById('progressRing');
      
      document.getElementById('exerciseTitle').innerText = current.title;
      document.getElementById('timeDisplay').innerText = `0:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
      document.getElementById('upNext').innerHTML = `Up Next: <span>${current.nextHint}</span>`;
      document.getElementById('progressText').innerText = `Step ${currentIndex + 1} of ${intervals.length}`;

      badge.className = 'status-badge badge-' + current.type;
      badge.innerText = current.type === 'work' ? 'WORK' : (current.type === 'rest' ? 'REST & SWITCH' : 'HALFTIME REST');
      
      const strokeColor = current.type === 'work' ? '#10b981' : (current.type === 'rest' ? '#f59e0b' : '#6366f1');
      ring.setAttribute('stroke', strokeColor);

      // Circle dashoffset animation
      const circumference = 264;
      const progress = timeLeft / current.duration;
      ring.style.strokeDashoffset = circumference * (1 - progress);
    }

    function tick() {
      if (timeLeft <= 3 && timeLeft > 0) playBeep(520, 0.08); // 3-2-1 countdown
      if (timeLeft === 0) {
        playBeep(880, 0.3); // Transition chime
        currentIndex++;
        if (currentIndex >= intervals.length) {
          clearInterval(timerId);
          isRunning = false;
          document.getElementById('exerciseTitle').innerText = 'Workout Complete!';
          document.getElementById('statusBadge').innerText = 'FINISHED';
          document.getElementById('toggleBtn').innerText = 'Start';
          return;
        }
        timeLeft = intervals[currentIndex].duration;
      } else {
        timeLeft--;
      }
      updateUI();
    }

    function togglePlay() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (!isRunning) {
        requestWakeLock();
        timerId = setInterval(tick, 1000);
        isRunning = true;
        document.getElementById('toggleBtn').innerText = 'Pause';
      } else {
        clearInterval(timerId);
        isRunning = false;
        document.getElementById('toggleBtn').innerText = 'Resume';
      }
    }

    function resetWorkout() {
      clearInterval(timerId);
      isRunning = false;
      currentIndex = 0;
      timeLeft = intervals[0].duration;
      document.getElementById('toggleBtn').innerText = 'Start';
      updateUI();
    }

    updateUI();
  </script>
</body>
</html>
